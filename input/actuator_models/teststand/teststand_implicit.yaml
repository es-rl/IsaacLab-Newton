# Teststand motor parameters (same M8010-6.333 as H1 elbow)
#
# Scalar values — single joint, no per-joint regex patterns needed.

# Effort/velocity limits
effort_limit_sim: 25.0          # N-m
velocity_limit_sim: 13.5        # rad/s

# PD gains (CMA-ES sysid optimized)
stiffness: 81.6507             # kp
damping: 0.495                 # kd

# Command transport delay
motor_lag_ms: 10               # ms

# Mechanical parameters (CMA-ES sysid optimized)
armature: 0.03225
dynamic_friction: 0.1711
viscous_friction: 0.00937
