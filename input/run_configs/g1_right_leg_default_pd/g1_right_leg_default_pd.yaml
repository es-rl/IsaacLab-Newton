# G1 right-leg benchmark: stock IsaacLab PD gains + URDF inertial.
# No SysID applied — this is the baseline for measuring SysID improvement.

simulation:
  physics_freq: 500
  control_freq: 500
  render_freq: 500
  integrator: implicitfast
  solver_iterations: 10
  ls_iterations: 10

actuator:
  model_type: implicit
  yaml_file: g1/g1_leg_implicit.yaml

benchmark:
  output_folder: output/g1_leg_benchmark_default_pd
  real_data_root: input/sysid_data/g1
