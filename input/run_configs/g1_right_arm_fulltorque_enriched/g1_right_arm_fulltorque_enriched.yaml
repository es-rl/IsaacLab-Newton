# G1 right-arm: full-torque GRU, 24-feature input (Tier 1: adds qfrc_bias + prev_torque).
# Same kp=0 physics as fulltorque_diffmujoco / richfeats.

simulation:
  physics_freq: 500
  control_freq: 500
  render_freq: 500
  integrator: implicitfast
  solver_iterations: 10
  ls_iterations: 10

actuator:
  model_type: full_torque_enriched
  yaml_file: g1/g1_arm_no_pd.yaml
  network_file: g1/g1_fulltorque_enriched_warmstart_script.pt
  stats_file: g1/g1_fulltorque_enriched_warmstart_stats.json

mass_overrides:
  right_shoulder_pitch_link:
    body_index: 31
    delta_mass: -0.100
  right_shoulder_roll_link:
    body_index: 32
    delta_mass: -0.150
  right_shoulder_yaw_link:
    body_index: 33
    delta_mass: -0.412
  right_elbow_link:
    body_index: 34
    delta_mass: 1.081

benchmark:
  output_folder: output/g1_benchmark_fulltorque_enriched
  real_data_root: input/sysid_data/g1
