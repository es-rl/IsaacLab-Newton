# v28: residual GRU trained with --tau-clip 10 (tighter than v27's 15).
# Clips v1 yaw saturation more aggressively while leaving pitch (max 9.76) /
# roll (9.08) / elbow (2.5) torques unaffected.
simulation:
  physics_freq: 200
  control_freq: 200
  render_freq: 200
  integrator: implicitfast
  solver_iterations: 10
  ls_iterations: 10
  usd_path: /home/vbhavanantha/h1_groundtruth_assets/h1_gripper_groundtruth_yawclamped_gripperpos.usd
benchmark:
  fix_root: true
  buffer_time: 2.0
  motor_lag_ms: null
  kp: null
  kd: null
  motion_files: input/sysid_data/h1/multijoint_gripper/test
  original_control_freq: null
  motion_name: multijoint_gripper_test10
  output_folder: output/h1_arm_gru_v28_test10_20260521
analysis:
  output_dir: output/h1_arm_gru_v28_analysis_test10_20260521
  sample_dt: 0.005
actuator:
  model_type: h1_arm_full_torque_enriched
  pd_plus_gru: true
  network_file: h1/h1_arm_tier1_enriched_v28_yawclip10_script.pt
  stats_file: h1/h1_arm_tier1_enriched_v28_yawclip10.stats.json
  hidden_size: 128
  num_layers: 2
  force_bound: 5.0
  include_qfrc_bias: true
  include_prev_torque: true
  include_geometric: false
  output_scale: [0.33, 0.33, 0.33, 0.33]
  yaml_file: h1/h1_arm_post_velsync_sysid_gen10_lag20.yaml
